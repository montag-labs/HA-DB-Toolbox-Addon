name: Verify Core image contract

on:
  pull_request:
    branches: [main]
    paths:
      - "ha-db-toolbox/config.yaml"
      - ".github/scripts/check_core_image_contract.py"
      - ".github/workflows/core-image-contract.yml"
  push:
    branches: [main]
    paths:
      - "ha-db-toolbox/config.yaml"
      - ".github/scripts/check_core_image_contract.py"
      - ".github/workflows/core-image-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"
      - name: Validate add-on image reference
        run: python .github/scripts/check_core_image_contract.py
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify published multiarch image and keyless signature
        shell: bash
        env:
          IMAGE: ghcr.io/montag-labs/ha-db-toolbox
        run: |
          version="$(python .github/scripts/check_core_image_contract.py --print-version)"
          docker buildx imagetools inspect "${IMAGE}:${version}"
          cosign verify "${IMAGE}:${version}" \
            --certificate-identity-regexp "^https://github.com/montag-labs/HA-DB-Toolbox/.github/workflows/publish.yml@refs/tags/v${version}$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
