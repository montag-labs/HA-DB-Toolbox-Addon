name: "HA DB Toolbox"
description: "Safe analysis and migration tooling for Home Assistant history data"
version: "0.0.5"
slug: "ha_db_toolbox"
url: "https://github.com/montag-labs/HA-DB-Toolbox-Addon"
image: "ghcr.io/montag-labs/ha-db-toolbox"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
legacy: true
ingress: true
ingress_port: 8099
panel_icon: "mdi:database-search"
hassio_role: default
map:
  - type: homeassistant_config
    read_only: true
environment:
  HA_DB_TOOL_DATA_PATH: /data
  HA_DB_TOOL_HA_CONFIG_PATH: /homeassistant
options: {}
schema: false
